AWSTemplateFormatVersion: '2010-09-09'
Description: 'SmartGram Pro - 04 Compute: ECR, High-Availability ECS Fargate, ALB, and Auto-Scaling'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'prod'
    Description: 'Deployment environment identifier'

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'VPC ID for ALB and ECS tasks'

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: 'Public Subnet 1 (AZ 1)'

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: 'Public Subnet 2 (AZ 2)'

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: 'Private Subnet 1 (AZ 1)'

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: 'Private Subnet 2 (AZ 2)'

  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID for ALB'

  EcsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: 'Security Group ID for ECS Tasks'

  EcsTaskExecutionRoleArn:
    Type: String
    Description: 'ARN of IAM ECS Task Execution Role'

  EcsTaskRoleArn:
    Type: String
    Description: 'ARN of IAM ECS Task Role'

  ImageUri:
    Type: String
    Default: ''
    Description: 'ECR Image URI (If empty, defaults to repository URI with latest tag)'

  MediaBucketName:
    Type: String
    Description: 'S3 bucket name for media evidence uploads'

  DeployNatGateway:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'If false, places tasks in public subnets with ALB-only ingress (cost-saving mode). If true, places in private subnets with NAT Gateway.'

  DesiredCount:
    Type: Number
    Default: 2
    Description: 'Desired number of Fargate tasks for high availability'

Conditions:
  UsePrivateSubnets: !Equals [!Ref DeployNatGateway, 'true']
  HasCustomImage: !Not [!Equals [!Ref ImageUri, '']]

Resources:
  # ============================================================================
  # ECR Repository
  # ============================================================================
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'smartgram-backend-${EnvironmentName}'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 5 most recent container images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============================================================================
  # ECS Cluster & CloudWatch Logs
  # ============================================================================
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'smartgram-${EnvironmentName}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/smartgram-api-${EnvironmentName}'
      RetentionInDays: 14

  # ============================================================================
  # Application Load Balancer & Target Group
  # ============================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'smartgram-${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'smartgram-${EnvironmentName}-tg'
      Port: 5000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # ============================================================================
  # ECS Fargate Task Definition
  # ============================================================================
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'smartgram-${EnvironmentName}-task'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref EcsTaskExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: smartgram-api
          Image: !If
            - HasCustomImage
            - !Ref ImageUri
            - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepository}:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: USERS_TABLE
              Value: SmartGramUsers
            - Name: COMPLAINTS_TABLE
              Value: SmartGramComplaints
            - Name: NOTICES_TABLE
              Value: SmartGramNotices
            - Name: S3_BUCKET
              Value: !Ref MediaBucketName
            - Name: SESSION_COOKIE_SECURE
              Value: 'false'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ============================================================================
  # ECS Fargate Service
  # ============================================================================
  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbHttpListener
    Properties:
      ServiceName: !Sub 'smartgram-${EnvironmentName}-service'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !If [UsePrivateSubnets, 'DISABLED', 'ENABLED']
          Subnets: !If
            - UsePrivateSubnets
            - [!Ref PrivateSubnet1Id, !Ref PrivateSubnet2Id]
            - [!Ref PublicSubnet1Id, !Ref PublicSubnet2Id]
          SecurityGroups:
            - !Ref EcsSecurityGroupId
      LoadBalancers:
        - TargetGroupArn: !Ref AlbTargetGroup
          ContainerName: smartgram-api
          ContainerPort: 5000
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============================================================================
  # Auto-Scaling Target & Policy
  # ============================================================================
  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 4
      MinCapacity: 2
      ResourceId: !Sub 'service/${EcsCluster}/${EcsService.Name}'
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ServiceScalingPolicyCpu:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'smartgram-${EnvironmentName}-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  EcrRepositoryUri:
    Description: 'ECR Repository URI for Backend Image'
    Value: !GetAtt EcrRepository.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-EcrRepositoryUri'

  AlbDnsName:
    Description: 'DNS Name of the Application Load Balancer'
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-AlbDnsName'

  AlbTargetGroupArn:
    Description: 'Target Group ARN'
    Value: !Ref AlbTargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-AlbTargetGroupArn'

  EcsClusterName:
    Description: 'ECS Cluster Name'
    Value: !Ref EcsCluster
    Export:
      Name: !Sub '${AWS::StackName}-EcsClusterName'

  EcsServiceName:
    Description: 'ECS Service Name'
    Value: !GetAtt EcsService.Name
    Export:
      Name: !Sub '${AWS::StackName}-EcsServiceName'
