name: Deploy SmartGram Pro to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'prod'

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}

jobs:
  build-and-deploy:
    name: Build & Deploy Full-Stack to AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies & Validate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import app, config; print('Backend modules import cleanly.')"

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation Master Stack
        run: |
          aws cloudformation deploy \
            --stack-name "smartgram-${{ env.ENVIRONMENT }}" \
            --template-file infrastructure/master-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides EnvironmentName="${{ env.ENVIRONMENT }}" \
            --region ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: smartgram-backend-${{ env.ENVIRONMENT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Sync React Static Assets to S3 Frontend Bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          FRONTEND_BUCKET="smartgram-frontend-${ACCOUNT_ID}-${{ env.AWS_REGION }}"
          aws s3 sync frontend/dist "s3://${FRONTEND_BUCKET}" --delete --region ${{ env.AWS_REGION }}

      - name: Update ECS Fargate Service
        run: |
          aws ecs update-service \
            --cluster "smartgram-${{ env.ENVIRONMENT }}-cluster" \
            --service "smartgram-${{ env.ENVIRONMENT }}-service" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront CDN Cache
        run: |
          CF_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='SmartGram Pro Master CDN (${{ env.ENVIRONMENT }})'].Id" \
            --output text)
          if [ -n "$CF_ID" ] && [ "$CF_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"
          fi
